name: Deploy Fatimyah Educational Trust to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npx vite build

      - name: Verify deployment identity
        run: |
          SA_EMAIL=$(node -e "try { const k=JSON.parse(process.env.SA_KEY); console.log(k.client_email); } catch(e) { console.log('Unknown'); }" )
          echo "::notice title=Deployment Service Account::Deploying as service account: $SA_EMAIL"
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FATIMYAH_EDUCATIONAL_TRUST }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FATIMYAH_EDUCATIONAL_TRUST }}
          channelId: live
          projectId: fatimyah-educational-trust
